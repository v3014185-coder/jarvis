name: Build JARVIS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y portaudio19-dev ffmpeg libsndfile1 python3-tk

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller --onefile --name=JARVIS \
            --add-data "jarvis_sample.wav:." \
            assistant.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-linux
          path: dist/JARVIS
